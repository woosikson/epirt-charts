      // 절기 사이에 빈 점을 하나 끼워 선을 끊는다 — 절기마다 따로 추정하므로
      // 경계를 가로지르는 선은 연속된 추정이 아니다.
      const last = dates[dates.length - 1];
      const gap = new Date(last + 'T00:00:00'); gap.setDate(gap.getDate() + 1);
      bounds.push(dates.length);
      dates.push(gap.toISOString().slice(0, 10));
      GR.forEach(g => ['i', 'm', 'l', 'h'].forEach(k => S[g][k].push(null)));
    }
    dates.push(...s.dates);
    GR.forEach(g => ['i', 'm', 'l', 'h'].forEach(k => S[g][k].push(...s.s[g][k])));
  });
  return { dates, S, bounds };
}

// ── 제목 아래 요약 + 자료 정보 ─────────────────────────────────────────────
function infoHTML() {
  return '<ul class="info">' + D.info.map(it => {
    const mail = it.mail ? ` <a href="mailto:${it.mail}">[${it.mail}]</a>` : '';
    const sub = it.sub ? '<ul>' + it.sub.map(x => `<li>${x}</li>`).join('') + '</ul>' : '';
    return `<li><b>${it.k}:</b> ${it.v}${mail}${sub}</li>`;
  }).join('') + '</ul>';
}
document.getElementById('infoBox').innerHTML = infoHTML();

// ── 1행: 절기 선택 + CSV ───────────────────────────────────────────────────
const bar1 = document.getElementById('bar1');
const noteEl = document.createElement('span'); noteEl.className = 'note';
let seasonSel = null, prevBtn = null, nextBtn = null;

(function buildBar1() {
  const lab = document.createElement('span'); lab.className = 'lab'; lab.textContent = '절기';
  bar1.appendChild(lab);
  prevBtn = document.createElement('button'); prevBtn.className = 'navbtn'; prevBtn.textContent = '◀';
  prevBtn.title = '이전 절기';
  prevBtn.onclick = () => { if (viewIdx > 0) { viewIdx--; render(); } };
  bar1.appendChild(prevBtn);
  seasonSel = document.createElement('select');
  VIEWS.forEach((v, k) => {
    const o = document.createElement('option'); o.value = k; o.textContent = v.label;
    seasonSel.appendChild(o);
  });
  seasonSel.onchange = () => { viewIdx = +seasonSel.value; render(); };
  bar1.appendChild(seasonSel);
  nextBtn = document.createElement('button'); nextBtn.className = 'navbtn'; nextBtn.textContent = '▶';
  nextBtn.title = '다음 절기';
  nextBtn.onclick = () => { if (viewIdx < VIEWS.length - 1) { viewIdx++; render(); } };
  bar1.appendChild(nextBtn);
  bar1.appendChild(noteEl);
  const sp = document.createElement('span'); sp.className = 'spacer'; bar1.appendChild(sp);
  const dl = document.createElement('button'); dl.id = 'dl'; dl.textContent = 'CSV + 설명 내려받기';
  dl.title = 'csv 와 컬럼 설명(README.txt) 을 zip 하나로 받습니다';
  dl.onclick = download; bar1.appendChild(dl);
})();

function syncBar1() {
  const v = VIEWS[viewIdx];
  seasonSel.value = viewIdx;
  noteEl.textContent = v.note || '';
  noteEl.className = 'note' + (/유행 없음/.test(v.note) ? ' warn' : '');
  prevBtn.disabled = viewIdx === 0;
  nextBtn.disabled = viewIdx === VIEWS.length - 1;
}

// ── 2행: 신뢰구간 chip ─────────────────────────────────────────────────────
const bar2 = document.getElementById('bar2');
function mkChip(name, label) {
  const b = document.createElement('button');
  b.className = 'chip'; b.textContent = label; b.dataset.g = name || '';
  b.onclick = () => setBand(name);
  bar2.appendChild(b);
}
mkChip(null, '없음');
GR.forEach(g => mkChip(g, g));
function syncChips() {
  [...bar2.querySelectorAll('.chip')].forEach(c => {
    const on = (c.dataset.g || null) === band;
    c.classList.toggle('on', on);
    c.style.background = on ? COL[c.dataset.g] : '';
  });
}
function setBand(g) { band = (band === g) ? null : g; syncChips(); render(); }
band = ALL;                              // 기본 = 「전체」의 신뢰구간을 띄운다
syncChips();

// ── 차트 ───────────────────────────────────────────────────────────────────
const chart = echarts.init(document.getElementById('chart'), null, { renderer: 'canvas' });
let A = null;
const lineStyleFor = g => g === ALL
  ? { width: 1.8, type: [5, 4] }
  : { width: (g === '19-49' || g === '50-64') ? 1.5 : 2.1 };

function bandSeries() {
  if (!band) return [];
  const s = A.S[band];
  return [
    { name: '__lo', type: 'line', xAxisIndex: 1, yAxisIndex: 1, data: s.l, stack: 'band',
      symbol: 'none', lineStyle: { opacity: 0 }, silent: true, z: 1, tooltip: { show: false } },
    { name: '__w', type: 'line', xAxisIndex: 1, yAxisIndex: 1, stack: 'band', symbol: 'none',
      data: s.h.map((h, i) => (h === null || s.l[i] === null) ? null : h - s.l[i]),
      lineStyle: { opacity: 0 }, silent: true, z: 1,
      areaStyle: { color: COL[band], opacity: 0.18 }, tooltip: { show: false } }
  ];
}

function buildOption() {
  const DT = A.dates;
  const bnd = A.bounds.map(i => ({ xAxis: i, lineStyle: { color: '#c4c4c4', type: 'solid' } }));
  const iliSeries = GR.map(g => ({
    name: g, type: 'line', xAxisIndex: 0, yAxisIndex: 0, data: A.S[g].i, symbol: 'none',
    lineStyle: lineStyleFor(g), itemStyle: { color: COL[g] }, emphasis: { focus: 'series' }, z: 3,
    markLine: (g === ALL && bnd.length) ? { silent: true, symbol: 'none', label: { show: false },
      lineStyle: { width: 1 }, data: bnd } : undefined
  }));
  const rtSeries = GR.map(g => ({
    name: g, type: 'line', xAxisIndex: 1, yAxisIndex: 1, data: A.S[g].m, symbol: 'none',
    lineStyle: lineStyleFor(g), itemStyle: { color: COL[g] }, emphasis: { focus: 'series' }, z: 3,
    markLine: g === ALL ? { silent: true, symbol: 'none', label: { show: false },
      lineStyle: { color: '#b4b4b4', type: 'dashed', width: 1 }, data: [{ yAxis: 1 }, ...bnd] } : undefined
  }));
  return {
    animation: false,
    backgroundColor: '#fff',
    textStyle: { fontFamily: '-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif' },
    color: GR.map(g => COL[g]),
    legend: { data: GR, top: 0, itemWidth: 20, itemHeight: 10, itemGap: 15,
              textStyle: { fontSize: 12.5, color: '#333' } },
    // 두 panel 사이 간격을 % 로 잡아 높이가 커져도 벌어지지 않게 한다
    grid: [{ left: 62, right: 18, top: '7%', height: '33%' },
           { left: 62, right: 18, top: '44%', bottom: 62 }],
    axisPointer: { link: [{ xAxisIndex: 'all' }], label: { backgroundColor: '#555' } },
    tooltip: {
      trigger: 'axis', axisPointer: { type: 'cross' }, confine: true,
      backgroundColor: 'rgba(255,255,255,.97)', borderColor: '#d8d8d8', borderWidth: 1,
      textStyle: { color: '#222', fontSize: 12.5 },
      formatter: p => {
        if (!p.length) return '';
        const i = p[0].dataIndex;
        if (GR.every(g => A.S[g].m[i] === null)) return `<b>${DT[i]}</b><div style="color:#888">자료 없음</div>`;
        let h = `<b>${DT[i]}</b>`;
        h += `<div style="margin-top:3px;color:#888">의사환자분율 ‰ · 감염재생산지수 [95% CrI]</div>`;
        GR.forEach(g => {
          const s = A.S[g];
          h += `<div><span style="display:inline-block;width:9px;height:9px;border-radius:50%;`
             + `background:${COL[g]};margin-right:6px"></span>`
             + `<span style="display:inline-block;width:47px">${g}</span>`
             + `<span style="display:inline-block;width:45px;text-align:right">${f1(s.i[i])}</span>`
             + `<b style="display:inline-block;width:50px;text-align:right">${f2(s.m[i])}</b>`
             + `<span style="color:#999"> [${f2(s.l[i])}–${f2(s.h[i])}]</span></div>`;
        });
        return h;
      }
    },
    dataZoom: [
      { type: 'inside', xAxisIndex: [0, 1] },
      { type: 'slider', xAxisIndex: [0, 1], bottom: 12, height: 22, borderColor: '#eee',
        handleSize: 18, textStyle: { fontSize: 11, color: '#888' } }
    ],
    xAxis: [
      { type: 'category', data: DT, gridIndex: 0, boundaryGap: false,
        axisLabel: { show: false }, axisTick: { show: false }, axisLine: { lineStyle: { color: '#d8d8d8' } } },
      { type: 'category', data: DT, gridIndex: 1, boundaryGap: false,
        axisLabel: { fontSize: 11.5, color: '#666', interval: 0, hideOverlap: false, formatter: fmtX },
        axisTick: { show: false }, axisLine: { lineStyle: { color: '#d8d8d8' } } }
    ],
    yAxis: [
      { gridIndex: 0, name: '의사환자분율 (‰)', nameLocation: 'middle', nameGap: 42,
        nameTextStyle: { fontSize: 12.5, color: '#555' }, min: 0,
        axisLabel: { fontSize: 11.5, color: '#666' }, axisLine: { show: false }, axisTick: { show: false },
        splitLine: { lineStyle: { color: '#eee' } } },
      { gridIndex: 1, name: '감염재생산지수 𝓡(t)', nameLocation: 'middle', nameGap: 42,
        nameTextStyle: { fontSize: 12.5, color: '#555' }, min: 0,
        axisLabel: { fontSize: 11.5, color: '#666' }, axisLine: { show: false }, axisTick: { show: false },
        splitLine: { lineStyle: { color: '#eee' } } }
    ],
    series: [...bandSeries(), ...iliSeries, ...rtSeries]
  };
}
// 절기는 두 해에 걸치므로 1월에는 연도를 보여준다
function fmtX(v) {
  const [y, m, d] = v.split('-');
  if (d !== '01') return '';
  return m === '01' ? `${y}년` : `${+m}월`;
}

function render() {
  A = assemble(VIEWS[viewIdx]);
  syncBar1();
  chart.setOption(buildOption(), { replaceMerge: ['series', 'xAxis', 'dataZoom'] });
}

render();
chart.on('mouseover', p => { if (GR.includes(p.seriesName) && p.seriesName !== band) setBand(p.seriesName); });
new ResizeObserver(() => chart.resize()).observe(document.getElementById('chart'));

// ── 내려받기 — csv + 설명(README.txt) 을 zip 하나로 ─────────────────────
// 압축 없이(store) 담는 최소 zip. 외부 라이브러리 없이 한 파일로 유지하기 위함이다.
const CRCT = (() => { const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++) { let c = i;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[i] = c >>> 0; } return t; })();
const crc32 = u8 => { let c = 0xFFFFFFFF;
  for (let i = 0; i < u8.length; i++) c = CRCT[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0; };

function makeZip(files) {                    // files: [{name, text}]
  const enc = new TextEncoder();
  const u16 = n => [n & 255, (n >>> 8) & 255];
  const u32 = n => [n & 255, (n >>> 8) & 255, (n >>> 16) & 255, (n >>> 24) & 255];
  const local = [], central = [];
  let off = 0;
  files.forEach(f => {
    const name = enc.encode(f.name), data = enc.encode(f.text);
    const crc = crc32(data), sz = data.length;
    // local file header — 방법 0(store) · flag bit 11 = 이름이 UTF-8
    const lh = new Uint8Array([...u32(0x04034b50), ...u16(20), ...u16(0x0800), ...u16(0),
      ...u16(0), ...u16(0), ...u32(crc), ...u32(sz), ...u32(sz),
      ...u16(name.length), ...u16(0)]);
    local.push(lh, name, data);
    central.push(new Uint8Array([...u32(0x02014b50), ...u16(20), ...u16(20), ...u16(0x0800),
      ...u16(0), ...u16(0), ...u16(0), ...u32(crc), ...u32(sz), ...u32(sz),
      ...u16(name.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0),
      ...u32(off)]), name);
    off += lh.length + name.length + sz;
  });
  const cdSize = central.reduce((a, b) => a + b.length, 0);
  const eocd = new Uint8Array([...u32(0x06054b50), ...u16(0), ...u16(0),
    ...u16(files.length), ...u16(files.length), ...u32(cdSize), ...u32(off), ...u16(0)]);
  const all = [...local, ...central, eocd];
  const out = new Uint8Array(all.reduce((a, b) => a + b.length, 0));
  let p = 0; all.forEach(b => { out.set(b, p); p += b.length; });
  return out;
}

function csvText() {
  const head = ['date'];
  GR.forEach(g => head.push(`ili_${g}`, `Rt_${g}`, `Rt_lo_${g}`, `Rt_hi_${g}`));
  const lines = [head.join(',')];
  A.dates.forEach((d, i) => {
    if (GR.every(g => A.S[g].m[i] === null)) return;
    const row = [d];
    GR.forEach(g => row.push(A.S[g].i[i], A.S[g].m[i], A.S[g].l[i], A.S[g].h[i]));
    lines.push(row.join(','));
  });
  return '\uFEFF' + lines.join('\n') + '\n';        // BOM — Excel 에서 한글이 깨지지 않게
}

function bundleName() { return 'rt_ili_age_' + VIEWS[viewIdx].key.replace(/\s*→\s*/g, '_'); }
function bundleFiles() {
  return [{ name: bundleName() + '.csv', text: csvText() },
          { name: 'README.txt', text: '\uFEFF' + D.readme.replace(/\n/g, '\r\n') }];
}

function download() {
  const zip = makeZip(bundleFiles());
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([zip], { type: 'application/zip' }));
  a.download = bundleName() + '.zip';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
</script>
