    tooltip: {
      trigger: 'axis', axisPointer: { type: 'cross' }, confine: true,
      backgroundColor: 'rgba(255,255,255,.96)', borderColor: '#ddd', borderWidth: 1,
      textStyle: { color: '#333', fontSize: 11.5 },
      formatter: p => {
        if (!p.length) return '';
        const i = p[0].dataIndex;
        if (GR.every(g => S[g].med[i] === null)) return `<b>${DT[i]}</b><div style="color:#888">자료 없음</div>`;
        let h = `<b>${DT[i]}</b>`;
        h += `<div style="margin-top:3px;color:#888">의사환자분율 ‰ · 감염 재생산지수 [95% CrI]</div>`;
        GR.forEach(g => {
          const s = S[g];
          h += `<div><span style="display:inline-block;width:8px;height:8px;border-radius:50%;`
             + `background:${s.color};margin-right:5px"></span>`
             + `<span style="display:inline-block;width:44px">${g}</span>`
             + `<span style="display:inline-block;width:42px;text-align:right">${f1(s.ili[i])}</span>`
             + `<b style="display:inline-block;width:46px;text-align:right">${f2(s.med[i])}</b>`
             + `<span style="color:#999"> [${f2(s.lo[i])}–${f2(s.hi[i])}]</span></div>`;
        });
        return h;
      }
    },
    dataZoom: [
      { type: 'inside', xAxisIndex: [0, 1] },
      { type: 'slider', xAxisIndex: [0, 1], bottom: 10, height: 20, borderColor: '#eee',
        handleSize: 16, textStyle: { fontSize: 10, color: '#999' } }
    ],
    xAxis: [
      { type: 'category', data: DT, gridIndex: 0, boundaryGap: false,
        axisLabel: { show: false }, axisTick: { show: false }, axisLine: { lineStyle: { color: '#ddd' } } },
      { type: 'category', data: DT, gridIndex: 1, boundaryGap: false,
        axisLabel: { fontSize: 10.5, color: '#888', interval: 0, hideOverlap: false,
                     formatter: v => fmtX(v) },
        axisTick: { show: false }, axisLine: { lineStyle: { color: '#ddd' } } }
    ],
    yAxis: [
      { gridIndex: 0, name: '의사환자분율 (‰)', nameLocation: 'middle', nameGap: 36,
        nameTextStyle: { fontSize: 11, color: '#666' }, min: 0,
        axisLabel: { fontSize: 10.5, color: '#888' }, axisLine: { show: false }, axisTick: { show: false },
        splitLine: { lineStyle: { color: '#f0f0f0' } } },
      { gridIndex: 1, name: '감염 재생산지수 𝓡(t)', nameLocation: 'middle', nameGap: 36,
        nameTextStyle: { fontSize: 11, color: '#666' }, min: 0,
        axisLabel: { fontSize: 10.5, color: '#888' }, axisLine: { show: false }, axisTick: { show: false },
        splitLine: { lineStyle: { color: '#f0f0f0' } } }
    ],
    series: [...bandSeries(), ...iliSeries, ...rtSeries]
  };
}
function fmtX(v) { const [y, m, d] = v.split('-'); return d === '01' ? `${+m}월` : ''; }

chart.setOption(buildOption());
chart.on('mouseover', p => { if (GR.includes(p.seriesName) && p.seriesName !== band) setBand(p.seriesName); });
new ResizeObserver(() => chart.resize()).observe(document.getElementById('chart'));

// ── CSV 내려받기 (자료가 있는 날짜만) ──────────────────────────────────────
document.getElementById('dl').onclick = () => {
  const head = ['date'];
  GR.forEach(g => head.push(`ili_${g}`, `Rt_${g}`, `Rt_lo_${g}`, `Rt_hi_${g}`));
  const lines = [head.join(',')];
  DT.forEach((d, i) => {
    if (GR.every(g => S[g].med[i] === null)) return;
    const row = [d];
    GR.forEach(g => row.push(S[g].ili[i], S[g].med[i], S[g].lo[i], S[g].hi[i]));
    lines.push(row.join(','));
  });
  const blob = new Blob(['﻿' + lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `rt_ili_age_${D.meta.season}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
};
</script>
</body>
</html>
